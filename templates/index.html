<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Bus Pass System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* Main Card */

        .container {
            width: 100%;
            max-width: 650px;

            background: rgba(255, 255, 255, 0.97);

            padding: 35px;

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .bus-icon {
            font-size: 55px;
            margin-bottom: 5px;
        }

        h1 {
            color: #4c1d95;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 15px;
        }

        /* Form */

        form {
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-weight: 600;
            color: #333;
        }

        input,
        select {
            width: 100%;

            padding: 13px 15px;

            border: 2px solid #e2e8f0;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        /* Button */

        button {
            width: 100%;

            margin-top: 10px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(90deg, #7c3aed, #2563eb);

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 18px rgba(37, 99, 235, 0.3);
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(37, 99, 235, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Success Message */

        .success {
            margin-top: 25px;

            padding: 20px;

            border-radius: 15px;

            background: linear-gradient(
                135deg,
                #dcfce7,
                #bbf7d0
            );

            border-left: 6px solid #16a34a;

            color: #166534;

            box-shadow:
                0 5px 15px rgba(22, 163, 74, 0.15);
        }

        .success p {
            margin-top: 8px;
        }

        /* Price Information */

        .price-box {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 25px;
        }

        .price-card {
            text-align: center;

            padding: 12px 5px;

            border-radius: 12px;

            color: white;

            font-weight: bold;
        }

        .daily {
            background: #f97316;
        }

        .weekly {
            background: #06b6d4;
        }

        .monthly {
            background: #8b5cf6;
        }

        .price-card span {
            display: block;

            font-size: 13px;

            margin-bottom: 4px;
        }

        .price-card strong {
            font-size: 18px;
        }

        /* Footer */

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 13px;
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .price-box {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>

    <div class="container">

        <!-- Header -->

        <div class="header">

            <div class="bus-icon">
                🚌
            </div>

            <h1>
                Cloud Bus Pass System
            </h1>

            <p class="subtitle">
                Fast, Simple & Smart Bus Pass Booking
            </p>

        </div>


        <!-- Booking Form -->

        <form method="POST">

            <div class="form-group">

                <label>
                    👤 Passenger Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    📱 Phone Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    📍 Source
                </label>

                <input
                    type="text"
                    name="source"
                    placeholder="Enter starting location"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    🎯 Destination
                </label>

                <input
                    type="text"
                    name="destination"
                    placeholder="Enter destination"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    🎫 Pass Type
                </label>

                <select name="pass_type">

                    <option value="Daily">
                        Daily - ₹50
                    </option>

                    <option value="Weekly">
                        Weekly - ₹250
                    </option>

                    <option value="Monthly">
                        Monthly - ₹800
                    </option>

                </select>

            </div>


            <button type="submit">
                🚌 Book Bus Pass
            </button>

        </form>


        <!-- Price Cards -->

        <div class="price-box">

            <div class="price-card daily">

                <span>DAILY</span>

                <strong>₹50</strong>

            </div>


            <div class="price-card weekly">

                <span>WEEKLY</span>

                <strong>₹250</strong>

            </div>


            <div class="price-card monthly">

                <span>MONTHLY</span>

                <strong>₹800</strong>

            </div>

        </div>


        <!-- Success Message -->

        {% if message %}

        <div class="success">

            <strong>
                ✅ {{ message }}
            </strong>


            {% if pass_id %}

            <p>

                🎫 Pass ID:

                <strong>
                    PASS-{{ pass_id }}
                </strong>

            </p>

            {% endif %}

        </div>

        {% endif %}


        <div class="footer">

            ☁️ Cloud Bus Pass System • Smart Transportation

        </div>

    </div>

</body>

</html>
